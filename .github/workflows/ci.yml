name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff pytest-cov
      - name: Ruff
        run: ruff check src/core src/ui tests --extend-exclude src/core/i18n.py
      - run: pytest -q --cov=src --cov-report=term-missing --cov-fail-under=54
